<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#0E1A2E"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="0.5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- ambient glows -->
  <circle cx="1060" cy="90" r="300" fill="#2563EB" opacity="0.16" filter="url(#blur18)"/>
  <circle cx="120" cy="580" r="260" fill="#22C55E" opacity="0.14" filter="url(#blur18)"/>
  <ellipse cx="950" cy="330" rx="300" ry="230" fill="url(#glow)"/>

  <!-- query streams into the cylinder -->
  <g stroke="url(#stream)" stroke-width="3" fill="none" opacity="0.85">
    <path d="M60 140 C 400 120, 640 200, 830 250"/>
    <path d="M60 330 C 380 330, 640 330, 800 330"/>
    <path d="M60 500 C 400 520, 640 440, 830 400"/>
  </g>
  <g fill="#A7F3D0" font-family="Menlo, monospace" font-size="20" opacity="0.55">
    <text x="80" y="130">SELECT * FROM gamechangers</text>
    <text x="80" y="322">WHERE speed &gt; legacy</text>
    <text x="80" y="540">ORDER BY proof DESC</text>
  </g>

  <!-- database cylinder -->
  <g transform="translate(950,320)">
    <ellipse cx="0" cy="-110" rx="150" ry="52" fill="#0E1A2E" stroke="url(#cyl)" stroke-width="6"/>
    <path d="M-150 -110 v210 a150 52 0 0 0 300 0 v-210" fill="#0B1424" stroke="url(#cyl)" stroke-width="6"/>
    <ellipse cx="0" cy="-40" rx="150" ry="52" fill="none" stroke="#34D399" stroke-width="4" opacity="0.75"/>
    <ellipse cx="0" cy="35" rx="150" ry="52" fill="none" stroke="#2563EB" stroke-width="4" opacity="0.8"/>
    <ellipse cx="0" cy="-110" rx="96" ry="32" fill="#10233C" stroke="#34D399" stroke-width="3"/>
    <circle cx="0" cy="-110" r="10" fill="#34D399"/>
  </g>

  <!-- glass card -->
  <rect x="72" y="88" width="760" height="464" rx="30" fill="#FFFFFF" opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.14"/>

  <!-- copy -->
  <text x="116" y="168" fill="#34D399" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="3">THE 2026 INDEX · 50+ TOOLS</text>
  <text x="112" y="272" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800">Awesome Database</text>
  <text x="112" y="352" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800">Tools</text>
  <text x="116" y="418" fill="#F8FAFC" opacity="0.8" font-family="Inter, Arial, sans-serif" font-size="27">Drop legacy stacks. Benchmarks, not vibes.</text>
  <text x="116" y="486" fill="#F8FAFC" opacity="0.62" font-family="Inter, Arial, sans-serif" font-size="22">DuckDB · SurrealDB · Turso · Neon · Dragonfly · Litestream</text>
</svg>
